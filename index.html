
<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR ANKIT 3D WORLD</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #080b18;
    font-family: Arial;
}
h1 {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    z-index: 2;
}
p {
    position: absolute;
    top: 65px;
    width: 100%;
    text-align: center;
    color: #00ffff;
    z-index: 2;
}
</style>
</head>

<body>

<h1>DR ANKIT 3D WORLD</h1>
<p>Move your mouse to rotate the cube | Scroll to zoom</p>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b18);

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.BoxGeometry(2,2,2);
const material = new THREE.MeshStandardMaterial({
color: 0x00aaff,
metalness: 0.5,
roughness: 0.25
});

const cube = new THREE.Mesh(geometry, material);
scene.add(cube);
const colors = [
    0x00aaff,
    0xff0000,
    0x00ff00,
    0xffff00,
    0xff00ff,
    0xffffff
];

let colorIndex = 0;

renderer.domElement.addEventListener('click', () => {
    colorIndex = (colorIndex + 1) % colors.length;
    cube.material.color.setHex(colors[colorIndex]);
});
const light = new THREE.PointLight(0xffffff, 100);
light.position.set(3,3,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff, 1));

let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (event) => {
targetY = (event.clientX / window.innerWidth - 0.5) * 3;
targetX = (event.clientY / window.innerHeight - 0.5) * 3;
});

window.addEventListener('wheel', (event) => {
camera.position.z += event.deltaY * 0.005;
camera.position.z = THREE.MathUtils.clamp(
camera.position.z, 3, 12
);
});

function animate() {
requestAnimationFrame(animate);

cube.rotation.x += (targetX - cube.rotation.x) * 0.05;
cube.rotation.y += (targetY - cube.rotation.y) * 0.05;

renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
